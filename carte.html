<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La carte — Sur Place</title>
<meta name="description" content="Carte des fermes bio certifiées qui produisent et vendent elles-mêmes, autour de vous.">

<style>
:root { --raisin: #6B2D5C; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.entete { position: relative; }
.entete .conteneur { max-width: none; }

/* Barre de recherche */
.barre { border-bottom: var(--trait); background: var(--papier); padding: 12px var(--gouttiere); display: grid; gap: 10px; }
.barre form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.champ { position: relative; flex: 1 1 260px; max-width: 460px; }
.champ input { width: 100%; font: inherit; font-size: 16px; border: var(--trait); border-radius: 999px; padding: 10px 18px; background: var(--blanc); outline: none; }
.champ input:focus { box-shadow: 0 0 0 3px var(--pousse); }
.suggestions { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--blanc); border: var(--trait); border-radius: 16px; list-style: none; z-index: 1200; overflow: hidden; display: none; }
.suggestions li { padding: 10px 16px; cursor: pointer; font-size: 15px; }
.suggestions li[aria-selected="true"], .suggestions li:hover { background: var(--pousse); }
.suggestions small { color: var(--encre-2); margin-left: 6px; }
select { font: inherit; font-size: 15px; font-weight: 600; border: var(--trait); border-radius: 999px; padding: 9px 14px; background: var(--blanc); cursor: pointer; }
.barre .bouton { padding: 9px 18px; font-size: 15px; }
.puces { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.puces::-webkit-scrollbar { display: none; }
.puces .puces { overflow: visible; padding: 0; }
.puce { flex: none; font: inherit; font-size: 14px; font-weight: 600; border: 1.5px solid var(--encre); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.puce[aria-pressed="true"] { background: var(--encre); color: var(--pousse); }

/* Zone liste + carte */
.zone { flex: 1; display: grid; grid-template-columns: minmax(340px, 430px) 1fr; min-height: 0; }
.panneau { position: relative; border-right: var(--trait); display: flex; flex-direction: column; min-height: 0; background: var(--papier); }
.etat { padding: 14px 20px; border-bottom: 1.5px solid var(--encre); font-size: 14.5px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.etat b { font-variation-settings: 'wdth' 68; font-size: 22px; font-weight: 800; }
.etat select { font-size: 13px; padding: 5px 10px; border-width: 1.5px; }
.liste-fermes { overflow-y: auto; flex: 1; }
.ferme { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid rgba(0,0,0,.18); padding: 16px 20px; cursor: pointer; }
.ferme:hover, .ferme.active { background: var(--blanc); }
.ferme .nom { font-variation-settings: 'wdth' 70; font-weight: 800; font-size: 22px; line-height: 1.02; display: block; }
.ferme .ou { font-size: 14px; color: var(--encre-2); display: flex; gap: 10px; margin-top: 4px; }
.ferme .ou .km { font-weight: 700; color: var(--encre); }
.ferme .fam { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tag { font-size: 12.5px; font-weight: 600; background: var(--papier-2); border-radius: 999px; padding: 2px 9px; }
.tag.ok { background: var(--encre); color: var(--pousse); }
.tag.vigne { background: var(--raisin); color: var(--blanc); display: inline-flex; align-items: center; gap: 4px; }
.tag.vigne svg, .puce svg, .legende svg { width: 14px; height: 14px; flex: none; }
.types { display: flex; gap: 6px; padding-right: 10px; margin-right: 4px; border-right: 1.5px solid var(--encre); flex: none; }
.types .puce { display: inline-flex; align-items: center; gap: 6px; }
.types .puce .rond { width: 12px; height: 12px; border-radius: 50%; background: var(--foret); border: 2px solid var(--papier); box-shadow: 0 0 0 1px var(--foret); }
.types .puce[aria-pressed="true"] { background: var(--foret); color: var(--blanc); border-color: var(--foret); }
.types .puce[data-t="vigneron"] svg { color: var(--raisin); }
.types .puce[data-t="vigneron"][aria-pressed="true"] svg { color: var(--blanc); }
.types .puce[data-t="vigneron"][aria-pressed="true"] { background: var(--raisin); color: var(--blanc); border-color: var(--raisin); }
.statut.vigne { border-color: var(--raisin); }
.vide { padding: 32px 22px; }
.vide h2 { font-size: 44px; margin-bottom: 14px; }
.vide p { color: var(--encre-2); margin-bottom: 18px; max-width: 36ch; }
.villes { display: flex; flex-wrap: wrap; gap: 8px; }
.charge { height: 3px; background: var(--pousse); transform-origin: left; transform: scaleX(0); transition: transform .3s ease; }

/* Fiche ferme */
.fiche { position: absolute; inset: 0; background: var(--papier); overflow-y: auto; z-index: 5; display: none; }
.fiche.ouverte { display: block; }
.fiche-haut { position: sticky; top: 0; background: var(--papier); border-bottom: 1.5px solid var(--encre); padding: 10px 20px; z-index: 2; }
.retour { font: inherit; font-weight: 700; font-size: 15px; background: none; border: 0; cursor: pointer; padding: 6px 0; }
.fiche-corps { padding: 22px 20px 40px; }
.fiche h2 { font-size: clamp(34px, 4vw, 46px); margin-bottom: 8px; }
.fiche .lieu { color: var(--encre-2); margin-bottom: 16px; }
.statut { border: 1.5px solid var(--encre); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; margin-bottom: 20px; background: var(--blanc); }
.statut.ok { background: var(--pousse); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
.actions .bouton { padding: 10px 18px; font-size: 15px; }
.fiche dl { display: grid; grid-template-columns: 120px 1fr; gap: 10px 14px; font-size: 15.5px; border-top: 1.5px solid var(--encre); padding-top: 18px; }
.fiche dt { font-weight: 700; }
.fiche dd ul { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; }
.fiche .petit { font-size: 13.5px; color: var(--encre-2); margin-top: 22px; }

/* Carte */
#carte { min-height: 0; background: var(--papier-2); }
.maplibregl-map { font-family: var(--font); }
.maplibregl-ctrl-group { border: var(--trait) !important; border-radius: 14px !important; box-shadow: none !important; overflow: hidden; }
.maplibregl-ctrl-attrib { font-size: 11px; background: rgba(232,234,219,.85) !important; }
.maplibregl-canvas:focus-visible { outline: 3px solid var(--foret-2); }

/* Mobile : bascule liste / carte */
.bascule { display: none; }
@media (max-width: 820px) {
  .zone { grid-template-columns: 1fr; position: relative; }
  .panneau { border-right: 0; }
  #carte { position: absolute; inset: 0; visibility: hidden; }
  body.vue-carte #carte { visibility: visible; z-index: 10; }
  .bascule { display: inline-flex; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 1100; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .entete .menu a.bouton { display: none; }
  .champ { flex-basis: 100%; max-width: none; }
  .barre button[type=submit] { display: none; }
  .fiche-corps { padding-bottom: 96px; }
  .barre { padding-top: 10px; padding-bottom: 10px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="ico-raisin" viewBox="0 0 24 24"><path d="M12 6.5V3.2M12 4.2c1.6-1.8 4-2 5.6-1.2-.6 1.9-2.6 3-5.6 2.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g fill="currentColor"><circle cx="8.2" cy="9.4" r="2.5"/><circle cx="12" cy="9.4" r="2.5"/><circle cx="15.8" cy="9.4" r="2.5"/><circle cx="10.1" cy="13.2" r="2.5"/><circle cx="13.9" cy="13.2" r="2.5"/><circle cx="12" cy="17" r="2.5"/></g></symbol>

<header class="entete">
  <div class="conteneur">
    <a class="marque" href="/" aria-label="Sur Place, accueil">
      <img src="/marque/logo-site.svg" alt="Sur Place" width="200" height="54">
    </a>
    <nav class="menu" aria-label="Navigation principale">
      <a href="/carte.html" aria-current="page">La carte</a>
      <a href="/ma-ferme.html">Je suis agriculteur</a>
    </nav>
  </div>
</header>

<div class="barre">
  <form id="form" autocomplete="off" role="search">
    <div class="champ">
      <label for="q" style="position:absolute;left:-9999px">Ville ou code postal</label>
      <input id="q" type="search" placeholder="Ville ou code postal" aria-autocomplete="list" aria-controls="sugg">
      <ul class="suggestions" id="sugg" role="listbox"></ul>
    </div>
    <label for="rayon" style="position:absolute;left:-9999px">Distance</label>
    <select id="rayon">
      <option value="10">10 km</option>

      <option value="100">100 km</option>
    </select>
    <button class="bouton" type="submit">Chercher</button>
    <button class="bouton clair" type="button" id="geo">Autour de moi</button>

  <div class="puces">

      <button class="puce" type="button" data-t="ferme" aria-pressed="false"><span class="rond"></span>Fermes</button>
      <button class="puce" type="button" data-t="vigneron" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-raisin"/></svg>Vignerons</button>

    <div class="puces" id="puces" aria-label="Filtrer par produit"></div>

</div>

<div class="zone">
  <aside class="panneau" aria-label="Résultats">
    <div class="charge" id="charge"></div>
    <div class="etat" id="etat" hidden>
      <span id="compte"></span>
      <select id="tri" aria-label="Trier"><option value="km">Plus proches</option><option value="nom">Nom A-Z</option></select>
    </div>
    <div class="liste-fermes" id="liste">
      <div class="vide">
        <h2>Où êtes-vous&nbsp;?</h2>
        <p>Tapez votre ville ou utilisez votre position. Nous affichons uniquement les fermes bio qui produisent et vendent elles-mêmes.</p>
        <div class="villes">
          <button class="bouton clair" data-ville="Montpellier">Montpellier</button>
          <button class="bouton clair" data-ville="Lyon">Lyon</button>
          <button class="bouton clair" data-ville="Rennes">Rennes</button>
          <button class="bouton clair" data-ville="Perpignan">Perpignan</button>
        </div>
      </div>
    </div>
    <section class="fiche" id="fiche" aria-live="polite"></section>
  </aside>
  <div id="carte" role="region" aria-label="Carte des fermes"></div>
</div>
<button class="bouton bascule" id="bascule" type="button">Voir la carte</button>

<script>
'use strict';
// ─── Référentiels ───────────────────────────────────────────────────────────
const FAMILLES = {
  legumes: 'Légumes', fruits: 'Fruits', viande: 'Viande', laitier: 'Lait & fromages', oeufs: 'Œufs',
  miel: 'Miel', vin: 'Vin & cidre', cereales: 'Pain & céréales', plantes: 'Plantes & aromates',
  huile: "Huile d'olive", mer: 'Produits de la mer', plants: 'Plants & fleurs'
};
// Centre approximatif des départements métropolitains
const DEPTS = [['01',46.2,5.23],['02',49.55,3.62],['03',46.34,3.3],['04',44.08,6.24],['05',44.66,6.35],['06',43.93,7.11],['07',44.72,4.53],['08',49.69,4.7],['09',42.96,1.6],['10',48.32,4.07],['11',43.2,2.35],['12',44.35,2.57],['13',43.53,5.44],['14',49.09,-0.36],['15',45.05,2.63],['16',45.7,0.16],['17',45.75,-0.67],['18',47.08,2.4],['19',45.37,1.88],['2A',41.86,8.98],['2B',42.39,9.21],['21',47.32,4.83],['22',48.46,-2.76],['23',46.1,2.04],['24',45.15,0.72],['25',47.24,6.02],['26',44.72,5.05],['27',49.07,1.17],['28',48.44,1.49],['29',48.24,-4.02],['30',44.01,4.17],['31',43.6,1.44],['32',43.64,0.59],['33',44.84,-0.58],['34',43.61,3.88],['35',48.1,-1.68],['36',46.81,1.69],['37',47.39,0.69],['38',45.19,5.72],['39',46.67,5.55],['40',43.89,-0.5],['41',47.59,1.34],['42',45.52,4.07],['43',45.04,3.88],['44',47.37,-1.85],['45',47.91,2.16],['46',44.66,1.74],['47',44.35,0.46],['48',44.5,3.5],['49',47.37,-0.55],['50',49.12,-1.33],['51',49.05,4.37],['52',48.11,5.14],['53',48.07,-0.77],['54',48.69,6.18],['55',48.98,5.38],['56',47.85,-2.76],['57',49.12,6.77],['58',47.06,3.66],['59',50.52,3.08],['60',49.41,2.34],['61',48.56,0.09],['62',50.52,2.64],['63',45.77,3.08],['64',43.3,-0.37],['65',43.23,0.08],['66',42.7,2.55],['67',48.58,7.75],['68',47.83,7.29],['69',45.76,4.84],['70',47.63,6.15],['71',46.67,4.51],['72',47.99,0.19],['73',45.57,6.39],['74',46.01,6.27],['75',48.86,2.35],['76',49.44,1.1],['77',48.73,2.98],['78',48.8,1.85],['79',46.65,-0.37],['80',49.92,2.3],['81',43.93,2.15],['82',44.02,1.35],['83',43.46,6.26],['84',43.95,5.09],['85',46.67,-1.43],['86',46.58,0.34],['87',45.84,1.26],['88',48.17,6.42],['89',47.8,3.57],['90',47.63,6.85],['91',48.63,2.25],['92',48.85,2.25],['93',48.92,2.48],['94',48.79,2.47],['95',49.07,2.1]];

// ─── Outils ─────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function km(a, b, c, d) {
  const R = 6371, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  const h = Math.sin(x / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const PETITS = new Set(['de','du','des','la','le','les','et','en','au','aux','sur','d','l']);
function joli(s) {
  if (!s) return '';
  if (s !== s.toUpperCase()) return s;
  return s.toLowerCase().replace(/(^|[\s'’(-])([\p{L}])/gu, (m, p, l, i) => p + l.toUpperCase())
    .split(' ').map((w, i) => i && PETITS.has(w.toLowerCase()) ? w.toLowerCase() : w).join(' ')
    .replace(/\b(Gaec|Earl|Sarl|Sas|Scea|Sca|Eurl|Scop|Gfa)\b/g, m => m.toUpperCase());
}
// Vigneron : producteur dont la seule activité déclarée à l'Agence Bio est la vigne.
const estVigneron = f => !!(f.metiers && f.metiers.length && f.metiers.every(m => /^(Viticulture|Vins)$/.test(m)));
const ICO_RAISIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-raisin"/></svg>';
const tel = t => t ? t.replace(/[^\d+]/g, '').replace(/^0033/, '+33') : '';

// ─── État ──────────────────────────────────────────────────────────────────
const etat = { centre: null, label: '', rayon: 30, fermes: [], filtres: new Set(), types: new Set(), tri: 'km', active: null };
const cacheDept = {};

// ─── Carte ─────────────────────────────────────────────────────────────────
const carte = new maplibregl.Map({
  container: 'carte', style: window.styleSurPlace, center: [2.4, 46.6], zoom: 4.6, minZoom: 3, maxZoom: 18,
  dragRotate: false, pitchWithRotate: false, attributionControl: false,
});
carte.touchZoomRotate.disableRotation();
carte.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
carte.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: 'Données bio © <a href="https://www.agencebio.org">Agence Bio</a>' }), 'bottom-left');
const VIDE = { type: 'FeatureCollection', features: [] };
// Pictogramme vigneron : grappe blanche sur pastille couleur raisin (contour vert pousse si vérifié)
function imageRaisin(contour) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><circle cx='32' cy='32' r='27' fill='#6B2D5C' stroke='${contour}' stroke-width='5'/><g transform='translate(14 13) scale(1.5)'><path d='M12 6.5V3.2M12 4.2c1.6-1.8 4-2 5.6-1.2-.6 1.9-2.6 3-5.6 2.4' fill='none' stroke='#C9E86A' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><g fill='#fff'><circle cx='8.2' cy='9.4' r='2.4'/><circle cx='12' cy='9.4' r='2.4'/><circle cx='15.8' cy='9.4' r='2.4'/><circle cx='10.1' cy='13.2' r='2.4'/><circle cx='13.9' cy='13.2' r='2.4'/><circle cx='12' cy='17' r='2.4'/></g></g></svg>`;
  const img = new Image(64, 64); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return img.decode().then(() => img);
}
const carteDispo = new Promise(ok => carte.on('load', async () => {
  const [r1, r2] = await Promise.all([imageRaisin('#E8EADB'), imageRaisin('#C9E86A')]);
  carte.addImage('raisin', r1, { pixelRatio: 2 }); carte.addImage('raisin-ok', r2, { pixelRatio: 2 });
  carte.addSource('rayon', { type: 'geojson', data: VIDE });
  carte.addSource('moi', { type: 'geojson', data: VIDE });
  carte.addSource('fermes', { type: 'geojson', data: VIDE, cluster: true, clusterRadius: 42, clusterMaxZoom: 12,
    clusterProperties: { nv: ['+', ['case', ['get', 'w'], 1, 0]] } });
  carte.addSource('selection', { type: 'geojson', data: VIDE });
  carte.addLayer({ id: 'rayon', type: 'line', source: 'rayon', paint: { 'line-color': '#1F4A2E', 'line-width': 2, 'line-dasharray': [2, 2] } });
  carte.addLayer({ id: 'grappes', type: 'circle', source: 'fermes', filter: ['has', 'point_count'],
    paint: { 'circle-color': ['case', ['==', ['get', 'nv'], ['get', 'point_count']], '#6B2D5C', '#1F4A2E'], 'circle-radius': ['step', ['get', 'point_count'], 15, 10, 19, 50, 24, 200, 29], 'circle-stroke-color': '#E8EADB', 'circle-stroke-width': 2.5 } });
  carte.addLayer({ id: 'grappes-n', type: 'symbol', source: 'fermes', filter: ['has', 'point_count'],
    layout: { 'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-allow-overlap': true },
    paint: { 'text-color': '#C9E86A' } });
  carte.addLayer({ id: 'grappes-vigne', type: 'symbol', source: 'fermes', filter: ['all', ['has', 'point_count'], ['>', ['get', 'nv'], 0]],
    layout: { 'icon-image': 'raisin', 'icon-size': 0.5, 'icon-allow-overlap': true, 'icon-ignore-placement': true,
      'icon-offset': ['step', ['get', 'point_count'], ['literal', [26, -26]], 10, ['literal', [32, -32]], 50, ['literal', [40, -40]], 200, ['literal', [46, -46]]] } });
  carte.addLayer({ id: 'points', type: 'circle', source: 'fermes', filter: ['all', ['!', ['has', 'point_count']], ['!', ['get', 'w']]],
    paint: { 'circle-color': ['case', ['get', 'v'], '#1F4A2E', '#2F8F4E'], 'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 6, 14, 9],
      'circle-stroke-color': ['case', ['get', 'v'], '#C9E86A', '#FFFFFF'], 'circle-stroke-width': ['case', ['get', 'v'], 3.5, 2.5] } });
  carte.addLayer({ id: 'vignes', type: 'symbol', source: 'fermes', filter: ['all', ['!', ['has', 'point_count']], ['get', 'w']],
    layout: { 'icon-image': ['case', ['get', 'v'], 'raisin-ok', 'raisin'], 'icon-size': ['interpolate', ['linear'], ['zoom'], 8, 0.68, 14, 0.9], 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
  carte.addLayer({ id: 'noms', type: 'symbol', source: 'fermes', minzoom: 12.5, filter: ['!', ['has', 'point_count']],
    layout: { 'text-field': ['get', 'n'], 'text-font': ['Noto Sans Bold'], 'text-size': 12, 'text-offset': [0, 1.2], 'text-anchor': 'top', 'text-max-width': 10, 'text-optional': true },
    paint: { 'text-color': '#1F4A2E', 'text-halo-color': '#E8EADB', 'text-halo-width': 1.6 } });
  carte.addLayer({ id: 'selection', type: 'circle', source: 'selection',
    paint: { 'circle-color': '#C9E86A', 'circle-radius': 11, 'circle-stroke-color': '#1F4A2E', 'circle-stroke-width': 3 } });
  carte.addLayer({ id: 'moi', type: 'circle', source: 'moi', paint: { 'circle-color': '#2A6BD1', 'circle-radius': 8, 'circle-stroke-color': '#fff', 'circle-stroke-width': 3 } });
  carte.on('click', 'grappes', async e => {
    const f = e.features[0];
    const zoom = await carte.getSource('fermes').getClusterExpansionZoom(f.properties.cluster_id);
    carte.easeTo({ center: f.geometry.coordinates, zoom: zoom + 0.3 });
  });
  for (const l of ['points', 'vignes']) carte.on('click', l, e => ouvrirFiche(e.features[0].properties.id));
  for (const l of ['grappes', 'points', 'vignes']) {
    carte.on('mouseenter', l, () => { carte.getCanvas().style.cursor = 'pointer'; });
    carte.on('mouseleave', l, () => { carte.getCanvas().style.cursor = ''; });
  }
  ok();
}));
function cercleGeo(lat, lng, km, n = 72) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * 2 * Math.PI;
    pts.push([lng + (km / (111.32 * Math.cos(lat * Math.PI / 180))) * Math.cos(a), lat + (km / 110.57) * Math.sin(a)]);
  }
  return { type: 'Feature', geometry: { type: 'LineString', coordinates: pts } };
}
const point = (lng, lat, props = {}) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] }, properties: props });
async function majCarte(sourceId, data) { await carteDispo; carte.getSource(sourceId).setData(data); }

// ─── Puces de filtre ───────────────────────────────────────────────────────
$('#puces').innerHTML = Object.entries(FAMILLES).map(([k, v]) => `<button class="puce" type="button" data-f="${k}" aria-pressed="false">${v}</button>`).join('');
$('#puces').addEventListener('click', e => {
  const b = e.target.closest('.puce'); if (!b) return;
  const f = b.dataset.f; etat.filtres.has(f) ? etat.filtres.delete(f) : etat.filtres.add(f);
  b.setAttribute('aria-pressed', etat.filtres.has(f)); afficher();
});

$('#types').addEventListener('click', e => {
  const b = e.target.closest('.puce'); if (!b) return;
  const t = b.dataset.t;
  etat.types.has(t) ? etat.types.delete(t) : etat.types.add(t);
  b.setAttribute('aria-pressed', etat.types.has(t)); if (etat.centre) afficher();
});

// ─── Géocodage (Géoplateforme IGN, repli sur la BAN) ───────────────────────
// Géocodage : on interroge en parallèle l'IGN (Géoplateforme) et la Base adresse nationale,
// avec un délai maximum, puis l'API Découpage administratif en dernier recours.
function avecDelai(url, ms = 4500) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { signal: ctl.signal }).finally(() => clearTimeout(t));
}
const sansAccent = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
async function geocoder(q, limite = 6) {
  const p = `q=${encodeURIComponent(q)}&type=municipality&limit=${limite}&autocomplete=1`;
  const banLike = base => avecDelai(base + p).then(r => r.ok ? r.json() : Promise.reject()).then(j => (j.features || []).length ? j.features : Promise.reject());
  try {
    return await Promise.any([banLike('https://data.geopf.fr/geocodage/search?'), banLike('https://api-adresse.data.gouv.fr/search/?')]);
  } catch (e) {}
  try {
    const cp = /^\d{5}$/.test(q.trim());
    const url = `https://geo.api.gouv.fr/communes?${cp ? 'codePostal=' + q.trim() : 'nom=' + encodeURIComponent(q)}&fields=nom,centre,codesPostaux,departement&boost=population&limit=${limite}`;
    const r = await avecDelai(url, 6000); if (!r.ok) return [];
    return (await r.json()).filter(c => c.centre).map(c => ({
      geometry: c.centre, properties: { city: c.nom, postcode: (c.codesPostaux || [])[0] || '', context: `${c.departement?.code || ''}, ${c.departement?.nom || ''}` }
    }));
  } catch (e) { return []; }
}
let suggs = [], suggIdx = -1, minuteur;
$('#q').addEventListener('input', () => {
  clearTimeout(minuteur);
  const q = $('#q').value.trim();
  if (q.length < 2) return fermerSugg();
  minuteur = setTimeout(async () => {
    const res = await geocoder(q);
    if ($('#q').value.trim() !== q || document.activeElement !== $('#q')) return;
    suggs = res;
    suggIdx = -1;
    $('#sugg').innerHTML = suggs.map((f, i) => `<li role="option" data-i="${i}" aria-selected="false">${esc(f.properties.city || f.properties.name)}<small>${esc(f.properties.postcode || '')} · ${esc((f.properties.context || '').split(',').slice(1, 2).join('').trim())}</small></li>`).join('');
    $('#sugg').style.display = suggs.length ? 'block' : 'none';
  }, 180);
});
$('#q').addEventListener('keydown', e => {
  if (!suggs.length || $('#sugg').style.display === 'none') return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); suggIdx = (suggIdx + (e.key === 'ArrowDown' ? 1 : -1) + suggs.length) % suggs.length;
    [...$('#sugg').children].forEach((li, i) => li.setAttribute('aria-selected', i === suggIdx));
  } else if (e.key === 'Escape') fermerSugg();
});
$('#sugg').addEventListener('pointerdown', e => e.preventDefault());
$('#sugg').addEventListener('click', e => { const li = e.target.closest('li'); if (li && suggs[+li.dataset.i]) choisir(suggs[+li.dataset.i]); });
function fermerSugg() { clearTimeout(minuteur); $('#sugg').style.display = 'none'; suggs = []; suggIdx = -1; }
function choisir(f) {
  fermerSugg();
  const [lng, lat] = f.geometry.coordinates; const nom = f.properties.city || f.properties.name;
  $('#q').value = nom; chercher(lat, lng, nom);
}
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  if (suggIdx >= 0 && suggs[suggIdx]) return choisir(suggs[suggIdx]);
  const q = $('#q').value.trim(); if (!q) return;
  fermerSugg(); $('#q').blur();
  message(`Recherche de « ${esc(q)} »…`);
  const r = await geocoder(q, 1);
  if (!r.length) return message(`Aucune commune trouvée pour « ${esc(q)} ». Vérifiez l'orthographe ou essayez le code postal.`);
  choisir(r[0]);
});
document.addEventListener('click', e => { if (!e.target.closest('.champ')) fermerSugg(); });
$('#rayon').addEventListener('change', () => { etat.rayon = +$('#rayon').value; if (etat.centre) chercher(etat.centre[0], etat.centre[1], etat.label); });
$('#tri').addEventListener('change', () => { etat.tri = $('#tri').value; afficher(); });
$('#geo').addEventListener('click', localiser);
$('#liste').addEventListener('click', e => { const b = e.target.closest('[data-ville]'); if (b) { $('#q').value = b.dataset.ville; $('#form').requestSubmit(); } });

function localiser() {
  if (!navigator.geolocation) return message("Votre navigateur ne permet pas la géolocalisation. Tapez votre ville.");
  message('Localisation en cours…');
  navigator.geolocation.getCurrentPosition(
    p => chercher(p.coords.latitude, p.coords.longitude, 'votre position', true),
    () => message("Position refusée ou indisponible. Tapez votre ville ou votre code postal."),
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
}

// ─── Chargement des fermes ─────────────────────────────────────────────────
function chargerDept(d) {
  // 1) fichier préparé chaque nuit (instantané)  2) repli sur l'API en direct
  if (!cacheDept[d]) cacheDept[d] = fetch(`/data/fermes/${d}.json`).then(r => r.ok ? r.json() : Promise.reject())
    .catch(() => fetch(`/api/fermes?dept=${d}`).then(r => { if (!r.ok) throw new Error(d); return r.json(); }))
    .catch(err => { delete cacheDept[d]; throw err; });
  return cacheDept[d];
}
let jeton = 0;
async function chercher(lat, lng, label, estMoi = false) {
  const monJeton = ++jeton;
  etat.centre = [lat, lng]; etat.label = label; etat.rayon = +$('#rayon').value; etat.fermes = [];
  fermerFiche();
  history.replaceState(null, '', `?lat=${lat.toFixed(4)}&lng=${lng.toFixed(4)}&r=${etat.rayon}&l=${encodeURIComponent(label)}`);
  majCarte('rayon', { type: 'FeatureCollection', features: [cercleGeo(lat, lng, etat.rayon)] });
  majCarte('moi', estMoi ? { type: 'FeatureCollection', features: [point(lng, lat)] } : VIDE);
  majCarte('selection', VIDE);
  const dLat = etat.rayon / 110.57, dLng = etat.rayon / (111.32 * Math.cos(lat * Math.PI / 180));
  carteDispo.then(() => carte.fitBounds([[lng - dLng, lat - dLat], [lng + dLng, lat + dLat]], { padding: 24, duration: 600 }));

  // Départements dont le centre est à moins de rayon + 70 km (un département fait ~100 km de large)
  const depts = DEPTS.filter(([, a, b]) => km(lat, lng, a, b) <= etat.rayon + 70).map(([c]) => c);
  let faits = 0, erreurs = 0; const vus = new Set();
  message(`Recherche des fermes autour de ${esc(label)}…`);
  barre(0.08);
  await Promise.all(depts.map(d => chargerDept(d).then(data => {
    if (monJeton !== jeton) return;
    for (const f of data.fermes) {
      if (vus.has(f.id)) continue;
      const dist = km(lat, lng, f.lat, f.lng);
      if (dist <= etat.rayon) { vus.add(f.id); etat.fermes.push({ ...f, km: dist, vigneron: estVigneron(f) }); }
    }
  }).catch(() => { erreurs++; }).finally(() => {
    if (monJeton !== jeton) return;
    faits++; barre(faits / depts.length);
    if (etat.fermes.length) afficher(faits < depts.length);
  })));
  if (monJeton !== jeton) return;
  barre(1); setTimeout(() => barre(0), 400);
  if (!etat.fermes.length) {
    majCarte('fermes', VIDE);
    return message(erreurs
      ? "L'annuaire de l'Agence Bio ne répond pas pour le moment. Réessayez dans quelques minutes."
      : `Aucune ferme en vente directe à moins de ${etat.rayon} km. Élargissez la distance.`);
  }
  afficher(false, erreurs);
  const id = new URLSearchParams(location.search).get('ferme'); if (id) ouvrirFiche(+id);
}
function barre(x) { $('#charge').style.transform = `scaleX(${x})`; }
function message(html) { $('#etat').hidden = true; $('#liste').innerHTML = `<div class="vide"><p>${html}</p></div>`; }

// ─── Affichage ─────────────────────────────────────────────────────────────
function visibles() {
  let l = etat.fermes;
  // Aucun bouton (ou les deux) : tout afficher ; sinon seulement le type choisi
  if (etat.types.size === 1) l = l.filter(f => etat.types.has(f.vigneron ? 'vigneron' : 'ferme'));
  if (etat.filtres.size) l = l.filter(f => [...etat.filtres].some(x => f.familles.includes(x)));
  return [...l].sort(etat.tri === 'nom' ? (a, b) => a.nom.localeCompare(b.nom, 'fr') : (a, b) => (b.verifiee - a.verifiee) || a.km - b.km);
}
function afficher(enCours = false, erreurs = 0) {
  const l = visibles();
  $('#etat').hidden = false;
  const nv = l.filter(f => f.vigneron).length, nf = l.length - nv;
  const morceaux = [];
  const voit = t => etat.types.size !== 1 || etat.types.has(t);
  if (voit('ferme')) morceaux.push(`${nf} ferme${nf > 1 ? 's' : ''}`);
  if (voit('vigneron') && (nv || !voit('ferme'))) morceaux.push(`${nv} vigneron${nv > 1 ? 's' : ''}`);
  $('#compte').innerHTML = `<b>${morceaux.join(' · ')}</b> à moins de ${etat.rayon} km${enCours ? ' · chargement…' : ''}${erreurs ? ' · données partielles' : ''}`;
  const MAX = 250;
  $('#liste').innerHTML = l.length ? l.slice(0, MAX).map(f => `
    <button class="ferme${etat.active === f.id ? ' active' : ''}" data-id="${f.id}">
      <span class="nom">${esc(joli(f.nom))}</span>
      <span class="ou"><span class="km">${f.km < 10 ? f.km.toFixed(1) : Math.round(f.km)} km</span><span>${esc(joli(f.ville))}</span></span>
      <span class="fam">${f.verifiee ? '<span class="tag ok">Vérifiée Sur Place</span>' : ''}${f.vigneron ? `<span class="tag vigne">${ICO_RAISIN}Vigneron</span>` : ''}${f.familles.filter(x => !(f.vigneron && x === 'vin')).slice(0, 4).map(x => `<span class="tag">${FAMILLES[x]}</span>`).join('')}</span>
    </button>`).join('') + (l.length > MAX ? `<div class="vide"><p>${l.length - MAX} autres fermes : réduisez la distance ou filtrez par produit.</p></div>` : '')
    : `<div class="vide"><p>Aucune ferme ne correspond à ces filtres. Retirez un filtre ou élargissez la distance.</p></div>`;
  majCarte('fermes', { type: 'FeatureCollection', features: l.map(f => point(f.lng, f.lat, { id: f.id, n: joli(f.nom), v: !!f.verifiee, w: !!f.vigneron })) });
}
$('#liste').addEventListener('click', e => { const b = e.target.closest('.ferme'); if (b) ouvrirFiche(+b.dataset.id); });

// ─── Fiche ─────────────────────────────────────────────────────────────────
function ouvrirFiche(id) {
  const f = etat.fermes.find(x => x.id === id); if (!f) return;
  etat.active = id;
  majCarte('selection', { type: 'FeatureCollection', features: [point(f.lng, f.lat)] });
  carteDispo.then(() => carte.easeTo({ center: [f.lng, f.lat], zoom: Math.max(carte.getZoom(), 13), duration: 600 }));
  const u = new URL(location); u.searchParams.set('ferme', id); history.replaceState(null, '', u);
  const nom = joli(f.nom);
  const itin = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;
  const signal = `mailto:contact@surplace.bio?subject=${encodeURIComponent(`Correction fiche ${nom} (${f.id})`)}&body=${encodeURIComponent(`Bonjour,\n\nJe signale une information à corriger sur la fiche « ${nom} » (n° ${f.id}, ${f.ville}) :\n\n`)}`;
  const depuis = f.bioDepuis ? new Date(f.bioDepuis).getFullYear() : null;
  $('#fiche').innerHTML = `
    <div class="fiche-haut"><button class="retour" type="button" id="retour">← Retour à la liste</button></div>
    <div class="fiche-corps">
      <h2>${esc(nom)}</h2>
      <p class="lieu">${esc(joli(f.adresse))}${f.adresse ? ', ' : ''}${esc(f.cp)} ${esc(joli(f.ville))} · à ${f.km.toFixed(1)} km</p>
      ${f.verifiee
        ? `<div class="statut ok"><b>Vérifiée Sur Place.</b> La ferme nous a confirmé la vente sur place.${f.horaires ? `<br>Horaires : ${esc(f.horaires)}` : ''}</div>`
        : f.vigneron
          ? `<div class="statut vigne"><span class="tag vigne">${ICO_RAISIN}Vigneron</span> Domaine viticole bio certifié qui déclare vendre aux particuliers, souvent au caveau. <b>Pas encore vérifié par téléphone</b> : appelez avant de vous déplacer.</div>`
          : `<div class="statut">Ferme bio certifiée qui déclare vendre aux particuliers. <b>Pas encore vérifiée par téléphone</b> : appelez avant de vous déplacer.</div>`}
      <div class="actions">
        <a class="bouton vert" href="${itin}" target="_blank" rel="noopener">Itinéraire</a>
        ${f.tel ? `<a class="bouton clair" href="tel:${tel(f.tel)}">Appeler</a>` : ''}
        ${f.site ? `<a class="bouton clair" href="${esc(/^https?:/.test(f.site) ? f.site : 'https://' + f.site)}" target="_blank" rel="noopener">Site web</a>` : ''}
      </div>
      <dl>
        ${f.familles.length ? `<dt>Produits</dt><dd><ul>${f.familles.map(x => `<li class="tag">${FAMILLES[x]}</li>`).join('')}</ul></dd>` : ''}
        ${f.productions.length ? `<dt>Détail</dt><dd>${esc(f.productions.join(', '))}</dd>` : ''}
        ${f.metiers.length ? `<dt>Métier</dt><dd>${esc(f.metiers.join(', '))}</dd>` : ''}
        ${f.gerant ? `<dt>Tenue par</dt><dd>${esc(joli(f.gerant))}</dd>` : ''}
        ${f.tel ? `<dt>Téléphone</dt><dd><a href="tel:${tel(f.tel)}">${esc(f.tel)}</a></dd>` : ''}
        ${depuis ? `<dt>Bio depuis</dt><dd>${depuis}</dd>` : ''}
        <dt>Certification</dt><dd>${esc(f.certificateur || 'Organisme certificateur')}${f.certifUrl ? ` · <a href="${esc(f.certifUrl)}" target="_blank" rel="noopener">voir le certificat</a>` : ''}</dd>
      </dl>
      <p class="petit">Informations issues de l'annuaire officiel de l'Agence Bio${f.maj ? `, mises à jour le ${new Date(f.maj).toLocaleDateString('fr-FR')}` : ''}. <a href="${signal}">Signaler une erreur</a> · <a href="/ma-ferme.html?id=${f.id}&nom=${encodeURIComponent(nom)}">C'est ma ferme</a></p>
    </div>`;
  $('#fiche').classList.add('ouverte'); $('#fiche').scrollTop = 0;
  $('#retour').addEventListener('click', fermerFiche);
  $('#retour').focus({ preventScroll: true });
  document.body.classList.remove('vue-carte'); majBascule();
}
function fermerFiche() {
  $('#fiche').classList.remove('ouverte');
  majCarte('selection', VIDE);
  etat.active = null;
  const u = new URL(location); u.searchParams.delete('ferme'); history.replaceState(null, '', u);
}

// ─── Mobile ────────────────────────────────────────────────────────────────
function majBascule() { $('#bascule').textContent = document.body.classList.contains('vue-carte') ? 'Voir la liste' : 'Voir la carte'; }
$('#bascule').addEventListener('click', () => { document.body.classList.toggle('vue-carte'); majBascule(); setTimeout(() => carte.resize(), 50); });

// ─── Démarrage selon l'URL ─────────────────────────────────────────────────
(function () {
  const p = new URLSearchParams(location.search);
  if (p.get('r')) $('#rayon').value = p.get('r');
  if (p.get('lat') && p.get('lng')) { $('#q').value = p.get('l') || ''; chercher(+p.get('lat'), +p.get('lng'), p.get('l') || 'ce point'); }
  else if (p.get('q')) { $('#q').value = p.get('q'); $('#form').requestSubmit(); }
  else if (p.get('autour')) localiser();
})();
</script>
