name: Exploration de sites partenaires
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/explorer-sites.mjs
      - run: |
          git config user.name "surplace-bot"; git config user.email "bot@surplace.bio"
          git add rapports && git commit -m "Exploration de sites" && git push || echo rien
