name: Analyse Bon Plan Bio
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/analyser-bpb.mjs
      - run: |
          git config user.name "surplace-bot"; git config user.email "bot@surplace.bio"
          git add rapports && git commit -m "Analyse Bon Plan Bio" && git push || echo rien
