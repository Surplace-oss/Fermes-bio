name: Vérification Sirene
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'exemples ou complet', default: 'exemples' }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: inputs.mode == 'exemples'
        run: node scripts/sirene-exemples.mjs
      - run: |
          git config user.name "surplace-bot"; git config user.email "bot@surplace.bio"
          git add rapports && git commit -m "Rapport Sirene" && git push || echo "rien à committer"
